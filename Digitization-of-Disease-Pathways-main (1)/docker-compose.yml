# ============================================================
# Production Docker Compose — Disease Pathways v3.0
# FAANG-Grade Infrastructure: Health Checks, Service Mesh,
# Ollama AI, Neo4j Graph DB, Redis Queue, Frontend Nginx
#
# Usage:
#   docker compose up -d           # Start all services
#   docker compose logs -f web     # Stream backend logs
#   docker compose down -v         # Teardown + clean volumes
# ============================================================

version: '3.9'

# ── NAMED VOLUMES ──────────────────────────────────────────
volumes:
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  ollama_models:
    driver: local
  vector_store_data:
    driver: local

# ── SHARED NETWORK ─────────────────────────────────────────
networks:
  disease_net:
    driver: bridge

services:

  # ── BACKEND: FastAPI + RAG Engine ─────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime       # Uses the lean final stage only
    image: disease-pathways-api:latest
    container_name: disease_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - OLLAMA_BASE_URL=http://ollama:11434
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - vector_store_data:/app/vector_stores
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - disease_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── CELERY WORKER: Background Vector Indexing ──────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: disease-pathways-api:latest
    container_name: disease_worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - vector_store_data:/app/vector_stores
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - disease_net
    restart: unless-stopped
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2

  # ── REDIS: Job Queue + Semantic Cache ─────────────────────
  redis:
    image: redis:7-alpine
    container_name: disease_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - disease_net
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NEO4J: Knowledge Graph Database ───────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: disease_neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512M
    volumes:
      - neo4j_data:/data
    networks:
      - disease_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # ── OLLAMA: Local LLM Inference (GPU optional) ─────────────
  ollama:
    image: ollama/ollama:latest
    container_name: disease_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - disease_net
    restart: unless-stopped
    # Uncomment for GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── FRONTEND: Nginx serving built React/Vite app ──────────
  frontend:
    image: nginx:alpine
    container_name: disease_frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/disease-pathways/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - disease_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
